# EXAMPLE ONLY - a shape to adapt, not a workflow to copy verbatim.
#
# Intent: gate the merge. The only level that cannot be skipped locally, so it is where the opt-in
# checks belong: they guard a surface that changes when a file is added, not on every wrap-up.

name: context

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The check-run name is THIS line, not `name:` above - the workflow name is not reported as a check.
    # Make it the *required status check* named in the host's branch protection, or the job runs green
    # and the pull request still never satisfies the requirement.
    name: context
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not tidiness. `verified` reads each leaf's last commit date
      # (`git log -1 --format=%cs -- <leaf>`). A depth-1 clone makes its boundary commit childless, so git
      # reports it as the root commit that added every file and every leaf takes that one date. The gate
      # now detects a shallow clone and fails loudly instead of inventing dates (see `GATES.md`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: memory tree is consistent
        run: python scripts/contextctl.py check --all
